# Zola configuration — Imperfect Homelab (a hat tip to Perfect Media Server)
# base_url is the GitHub Pages project URL (the workflow passes it explicitly;
# the tailnet preview overrides it). Pages runs plain `zola build` itself, so
# nix is only needed for the generated reference.
base_url = "https://ww4.github.io/imperfect-homelab"
title = "Imperfect Homelab"
description = "Install a complete self-hosted homelab from a public NixOS module library, then learn how it is built so you can add to it."
default_language = "en"

compile_sass = false
minify_html = true
generate_feeds = false
build_search_index = false

[markdown]

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"
style = "class"


external_links_target_blank = false
smart_punctuation = true

[extra]
library_url = "https://github.com/ww4/homelab-modules"
library_mirror = "https://github.com/ww4/homelab-modules"
